# k8s/30-secret.yaml 样例（占位值，可安全提交）
#
# 正式文件由 gen-secret.sh 生成（含真实凭据，已被 .gitignore 排除）；
# 也可复制本文件为 30-secret.yaml 后手工填写。
#
# 键名都带 OCGW_ 前缀（网关 envFrom 整体注入，pydantic-settings 按前缀读取）：
# - OCGW_SESSION_SECRET_KEY：会话签名密钥，`openssl rand -hex 32`；重生成使所有会话失效
# - OCGW_ANTHROPIC_BASE_URL / OCGW_ANTHROPIC_API_KEY：注入每个用户 OpenClaw Pod
#   的模型凭据（OpenClaw 原生环境变量，走 Anthropic 兼容 API）。留空则用户在
#   Control UI 里自行配置模型（原生方式）。
# - OCGW_ANTHROPIC_MODEL / OCGW_ANTHROPIC_SMALL_FAST_MODEL：模型名。非官方端点
#   （如 GLM/DeepSeek 的 Anthropic 兼容 API）必须设置，否则默认请求 claude-* 型号。
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-secrets
  namespace: openclaw-system
type: Opaque
stringData:
  OCGW_SESSION_SECRET_KEY: "change-me-openssl-rand-hex-32"
  OCGW_ANTHROPIC_BASE_URL: ""
  OCGW_ANTHROPIC_API_KEY: ""
  OCGW_ANTHROPIC_MODEL: ""
  OCGW_ANTHROPIC_SMALL_FAST_MODEL: ""
